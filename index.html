async function requestPro(){let ex=null;try{const s=await getDoc(doc(db,'premiumRequests',auth.currentUser.uid));if(s.exists())ex=s.data()}catch{}
if(ex?.status==='pending')return open(`<h2>Request sent</h2><p class="mut">Staff are reviewing your request. You'll get Pro as soon as it's approved.</p>`);
open(`<p class="ey">SVN BUSINESS PRO</p><h2>Request Pro access</h2>${ex?.status==='rejected'?`<p class="bad" style="margin-bottom:10px">Your last request was declined${ex.reviewNote?': '+esc(ex.reviewNote):''}. You can ask again.</p>`:''}<form id="qf" class="form"><label>Why would Pro help your business?<textarea name="m" rows="4" maxlength="500" required></textarea></label><button class="pri">Send request</button></form>`);
$('#qf').onsubmit=async e=>{e.preventDefault();const d={userId:auth.currentUser.uid,userName:me.fullName||'',userEmail:me.email||'',message:new FormData(e.target).get('m').trim(),status:'pending',submittedAt:ts()};try{const r=doc(db,'premiumRequests',auth.currentUser.uid);ex?await setDoc(r,d):await setDoc(r,d);close();toast('Request sent to staff.')}catch(er){toast(er.code==='permission-denied'?'Could not send. Rules may not be published yet.':'Could not send request.')}}}
/* ---------- profile ---------- */
function profileView(c){const pro=isPro(),exp=me.premiumExpiresAt?.toDate?.();c.innerHTML=`<div class="pg"><div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${avatar(64)}<div style="flex:1"><h2 style="margin:0">${esc(me.fullName)}</h2><p class="mut">${esc(me.email)}</p></div>${pro?`<span class="bdg pro">PRO${exp&&exp.getFullYear()<2090?' · until '+exp.toLocaleDateString():''}</span>`:`<button class="sec" id="rq">Request Pro</button>`}</div>
<div class="card"><h2>Profile picture <span class="bdg pro">PRO</span></h2>${pro?`<div class="emo">${['😀','😎','🚀','💼','📈','🦁','🌟','🧠'].map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div><div style="margin-top:12px"><label>Or use your own photo<input type="file" id="ph" accept="image/*"></label></div><p class="mut" style="margin-top:8px">Your photo is resized and stored only in this browser. It is never uploaded. Clearing site data or switching device removes it.</p><button class="lnk" id="rm">Remove picture</button>`:lockCard('Custom avatar and photo')}</div>
<div class="card"><h2>Appearance</h2><div class="chips">${[['light','☀️ Light'],['dark','🌙 Dark'],['system','⚙️ System']].map(t=>`<button class="ch ${document.documentElement.dataset.theme===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div></div>
<div class="card"><h2>Business profile</h2><form id="bp" class="fm"><label>Business name<input name="name" value="${esc(me.businessName)}" required></label><label>Phone<input name="phone" value="${esc(me.phone)}"></label><label class="w">Owner name<input name="fullName" value="${esc(me.fullName)}" required></label><button class="pri w">Save changes</button></form></div>
<button class="sec" id="lo">Sign out</button></div>`;
$('#rq')&&($('#rq').onclick=requestPro);c.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{const t=setTheme(b.dataset.t);try{await updateDoc(doc(db,'users',auth.currentUser.uid),{theme:t,updatedAt:ts()});me.theme=t}catch{}profileView(c)});
c.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{localStorage.setItem(avKey(),JSON.stringify({t:'emoji',v:b.dataset.e}));$('#hav').innerHTML=avatar();profileView(c)});
$('#rm')&&($('#rm').onclick=()=>{localStorage.removeItem(avKey());$('#hav').innerHTML=avatar();profileView(c)});
$('#ph')&&($('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const img=await createImageBitmap(f),cv=document.createElement('canvas'),S=192;cv.width=cv.height=S;const m=Math.min(img.width,img.height);cv.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);let q=.82,u=cv.toDataURL('image/jpeg',q);for(;;){try{localStorage.setItem(avKey(),JSON.stringify({t:'img',v:u}));break}catch{q-=.2;if(q<.2)throw Error('Not enough browser storage for this photo.');u=cv.toDataURL('image/jpeg',q)}}$('#hav').innerHTML=avatar();profileView(c)}catch(er){toast(er.message||'Could not use that image.')}});
$('#bp').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const b=writeBatch(db);b.update(doc(db,'users',auth.currentUser.uid),{fullName:f.fullName,phone:f.phone,businessName:f.name,updatedAt:ts()});b.update(doc(db,'businesses',bid),{name:f.name,phone:f.phone,updatedAt:ts()});await b.commit();Object.assign(me,{fullName:f.fullName,phone:f.phone,businessName:f.name});$('#uname').textContent=me.fullName;toast('Saved')}catch{toast('Could not save changes.')}};
$('#lo').onclick=()=>signOut(auth)}
/* ---------- staff dashboard ---------- */
const DUR=[['30 days',30],['3 months',90],['6 months',180],['1 year',365],['No expiry',36500]];
const durSel=id=>`<select id="${id}">${DUR.map(d=>`<option value="${d[1]}" ${d[1]===365?'selected':''}>${d[0]}</option>`).join('')}</select>`;
const exp=d=>Timestamp.fromDate(new Date(Date.now()+d*864e5));
async function grant(uid,days,reason,extra=[]){const b=writeBatch(db);b.update(doc(db,'users',uid),{premium:true,premiumSource:'staff_grant',premiumGrantedBy:auth.currentUser.uid,premiumGrantedAt:ts(),premiumExpiresAt:exp(days),updatedAt:ts()});b.set(doc(collection(db,'adminAuditLogs')),{admin:auth.currentUser.uid,userId:uid,action:'grant_premium',days,reason:reason||'',createdAt:ts()});extra.forEach(f=>f(b));await b.commit()}
async function admin(c){if(!isAdmin()){page='home';return render()}c.innerHTML='<div class="pg"><div class="card">Loading…</div></div>';
try{const[rq,pu,mp]=await Promise.all([getDocs(query(collection(db,'premiumRequests'),where('status','==','pending'))),getDocs(query(collection(db,'users'),where('premium','==',true))),getDocs(query(collection(db,'manualPaymentRequests'),where('status','==','pending')))]);
c.innerHTML=`<div class="pg"><div class="card"><h2>Premium requests (${rq.size})</h2>${rq.docs.map(d=>{const r=d.data();return `<div class="rw" style="align-items:flex-start"><div><b>${esc(r.userName)}</b> <span class="mut">${esc(r.userEmail)}</span><p>${esc(r.message)}</p></div><div class="chips"><button class="pri ap" data-u="${d.id}">Approve</button><button class="sec rj" data-u="${d.id}">Reject</button></div></div>`}).join('')||'<p class="mut">No pending requests.</p>'}</div>
<div class="card"><h2>Pro users (${pu.size})</h2>${pu.docs.map(d=>{const u=d.data(),e=u.premiumExpiresAt?.toDate?.();return `<div class="rw"><div><b>${esc(u.fullName)}</b> <span class="mut">${esc(u.email)}</span><p class="mut">${esc(u.premiumSource||'')} · ${e?(e.getFullYear()>2090?'no expiry':'until '+e.toLocaleDateString()):'—'}${e&&e<new Date()?' · EXPIRED':''}</p></div><button class="sec rv" data-u="${d.id}">Revoke</button></div>`}).join('')||'<p class="mut">No Pro users.</p>'}</div>
<div class="card"><h2>Grant Pro by user ID</h2><form id="gf" class="fm"><label>User UID<input name="u" required></label><label>Duration${durSel('gd')}</label><label class="w">Reason<input name="r"></label><button class="pri w">Grant Pro</button></form></div>
<div class="card"><h2>OPay payments (${mp.size})</h2>${mp.docs.map(d=>{const p=d.data();return `<div class="rw"><div><b>${esc(p.userName)}</b> <span class="mut">${esc(p.userEmail)}</span><p class="mut">${esc(p.transactionReference)} · ${esc(p.paymentDate)} · ${money(p.amount)}</p></div><div class="chips"><button class="pri pa" data-i="${d.id}" data-u="${p.userId}">Approve</button><button class="sec pj" data-i="${d.id}">Reject</button></div></div>`}).join('')||'<p class="mut">No pending payments.</p>'}</div></div>`;
const done=async(f,m)=>{try{await f();toast(m);admin(c)}catch(er){toast(er.message||'Action failed')}};
c.querySelectorAll('.ap').forEach(b=>b.onclick=()=>open(`<h2>Approve Pro</h2><label>Duration${durSel('ad')}</label><button class="pri" id="go" style="margin-top:14px">Approve</button>`)||($('#go').onclick=()=>{const u=b.dataset.u,d=+$('#ad').value;close();done(()=>grant(u,d,'approved request',[bt=>bt.update(doc(db,'premiumRequests',u),{status:'approved',reviewedBy:auth.currentUser.uid,reviewedAt:ts()})]),'Approved')}));
c.querySelectorAll('.rj').forEach(b=>b.onclick=()=>{const n=prompt('Reason (shown to the user)');if(n===null)return;done(async()=>{const bt=writeBatch(db);bt.update(doc(db,'premiumRequests',b.dataset.u),{status:'rejected',reviewNote:n,reviewedBy:auth.currentUser.uid,reviewedAt:ts()});bt.set(doc(collection(db,'adminAuditLogs')),{admin:auth.currentUser.uid,userId:b.dataset.u,action:'reject_premium_request',reason:n,createdAt:ts()});await bt.commit()},'Rejected')});
c.querySelectorAll('.rv').forEach(b=>b.onclick=()=>{if(!confirm('Revoke Pro for this user?'))return;done(async()=>{const bt=writeBatch(db);bt.update(doc(db,'users',b.dataset.u),{premium:false,premiumRevokedAt:ts(),premiumRevokedBy:auth.currentUser.uid,updatedAt:ts()});bt.set(doc(collection(db,'adminAuditLogs')),{admin:auth.currentUser.uid,userId:b.dataset.u,action:'revoke_premium',createdAt:ts()});await bt.commit()},'Revoked')});
$('#gf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));done(()=>grant(f.u.trim(),+$('#gd').value,f.r),'Pro granted')};
c.querySelectorAll('.pa').forEach(b=>b.onclick=()=>done(()=>grant(b.dataset.u,365,'manual OPay payment',[bt=>bt.update(doc(db,'manualPaymentRequests',b.dataset.i),{status:'approve',reviewedBy:auth.currentUser.uid,reviewedAt:ts()})]),'Payment approved'));
c.querySelectorAll('.pj').forEach(b=>b.onclick=()=>{const n=prompt('Reason');if(n===null)return;done(()=>updateDoc(doc(db,'manualPaymentRequests',b.dataset.i),{status:'reject',reviewReason:n,reviewedBy:auth.currentUser.uid,reviewedAt:ts()}),'Rejected')})}
catch(er){c.innerHTML=`<div class="pg"><div class="card"><h2>Staff dashboard</h2><p class="mut">${esc(er.code==='permission-denied'?'Permission denied. Publish the new Firestore rules first.':er.message)}</p></div></div>`}}
if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.update())).catch(()=>{});
</script></body></html>
