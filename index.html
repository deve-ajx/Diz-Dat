*{box-sizing:border-box}html[data-theme=dark]{--bg:#0b0d14;--solid:#12151f;--glass:rgba(22,26,40,.72);--line:rgba(255,255,255,.09);--ink:#eef0f6;--muted:#8c93a6;--acc:#7c8cff;--acc2:#5eead4;--sh:0 12px 32px rgba(0,0,0,.35);color-scheme:dark}html[data-theme=light]{--bg:#f4f5fa;--solid:#fff;--glass:rgba(255,255,255,.8);--line:rgba(20,24,40,.09);--ink:#141828;--muted:#646c82;--acc:#4f5df5;--acc2:#0ea5a0;--sh:0 10px 28px rgba(30,40,90,.1);color-scheme:light}

body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}[hidden]{display:none!important}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}
.ey{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--acc);margin-bottom:6px}.mut{color:var(--muted);font-size:13px}.bad{color:#f0647a}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--solid) 80%,transparent);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.pri{border:0;border-radius:14px;padding:12px 16px;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)));box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 30%,transparent)}.sec{border:1px solid var(--line);background:transparent;border-radius:14px;padding:11px 14px;font-weight:600}.lnk{border:0;background:none;color:var(--acc);font-weight:700;padding:4px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.card h2{font-size:17px;margin-bottom:12px}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 400px at 20% 0,color-mix(in srgb,var(--acc) 25%,transparent),transparent 60%),var(--bg)}#auth .card{width:min(440px,100%);padding:28px}#auth form,.form{display:grid;gap:14px}.logo{width:56px;height:56px;border-radius:16px;margin-bottom:14px}
#app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}aside{position:sticky;top:0;height:100vh;padding:20px 12px;background:var(--glass);border-right:1px solid var(--line);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:4px}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;padding:4px 10px 22px}.brand img{width:34px;height:34px;border-radius:10px}
.nv{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:14px;font-weight:600;text-align:left}.nv.on,.nv:hover{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px clamp(16px,4vw,40px);background:var(--glass);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}header h1{font-size:24px}.who{display:flex;gap:10px;align-items:center}
.av{display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:800;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.pg{padding:24px clamp(16px,4vw,40px);display:grid;gap:16px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{padding:16px}.kpi p{font-size:12px;color:var(--muted);font-weight:700}.kpi h3{font-size:22px;margin-top:8px}
.rw{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.rw:last-child{border:0}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase}
.bdg{padding:4px 9px;border-radius:99px;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}.pro{background:linear-gradient(135deg,#f5c542,#e58e26);color:#2b1a00}
.chips{display:flex;gap:8px;flex-wrap:wrap}.ch{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px}.ch.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:8px;border-radius:9px;background:color-mix(in srgb,var(--acc) 15%,transparent);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fm .w{grid-column:1/-1}.lock{text-align:center;padding:22px;border:1px dashed var(--line);border-radius:18px}
#modal{position:fixed;inset:0;z-index:30;background:rgba(5,7,14,.62);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}.mc{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:24px;padding:24px}.mc h2{margin-bottom:14px}#mx{position:absolute;right:14px;top:10px;border:0;background:none;font-size:26px;color:var(--muted)}
#toast{position:fixed;z-index:50;top:16px;left:50%;transform:translate(-50%,-20px);background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px 16px;opacity:0;transition:.25s;pointer-events:none;max-width:92vw}#toast.show{opacity:1;transform:translate(-50%,0)}
#bnav{display:none}.emo{display:flex;gap:8px;flex-wrap:wrap}.emo button{font-size:24px;border:1px solid var(--line);background:none;border-radius:12px;padding:6px 10px}svg{width:100%;height:auto;display:block}
@media(max-width:760px){#app{display:block}aside{display:none}.pg{padding-bottom:110px}header h1{font-size:20px}.two,.fm{grid-template-columns:1fr}#bnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;justify-content:space-around;padding:8px;background:var(--glass);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}#bnav .nv{flex-direction:column;gap:2px;width:auto;padding:6px 10px;font-size:10px}#bnav .nv b{font-size:18px}}

try{const[rq,pu,mp,pp]=await Promise.all([getDocs(query(collection(db,'premiumRequests'),where('status','==','pending'))),getDocs(query(collection(db,'users'),where('premium','==',true))),getDocs(query(collection(db,'manualPaymentRequests'),where('status','==','pending'))),getDocs(query(collection(db,'proPayments'),orderBy('verifiedAt','desc'),limit(50))).catch(()=>({size:0,docs:[]}))]);
c.innerHTML=`<div class="pg"><div class="card"><h2>Pro payments (${pp.size})</h2><p class="mut" style="margin-bottom:10px">Paystack payments are verified and activated automatically. Staff can still grant Pro below.</p><div class="tw"><table><thead><tr><th>Email</th><th>Amount</th><th>Reference</th><th>Date</th><th>Status</th><th>Pro</th></tr></thead><tbody>${pp.docs.map(d=>{const p=d.data(),f=t=>t?.toDate?t.toDate().toLocaleDateString():'—';return `<tr><td>${esc(p.email)}</td><td>${money(p.amount/100)}</td><td>${esc(d.id)}</td><td>${f(p.verifiedAt)}</td><td><span class="bdg">${esc(p.status)}</span></td><td>${p.status==='approved'?'Active until '+f(p.proExpiresAt):'Not activated'}</td></tr>`}).join('')||'<tr><td colspan="6" class="mut">No payments yet.</td></tr>'}</tbody></table></div></div><div class="card"><h2>Send a notification to all users</h2><form id="af" class="form"><textarea name="m" rows="3" maxlength="500" required placeholder="Write your announcement (max 500 characters)"></textarea><button class="pri">Send to everyone</button></form></div><div class="card"><h2>Premium requests (${rq.size})</h2>${rq.docs.map(d=>{const r=d.data();return `<div class="rw" style="align-items:flex-start"><div><b>${esc(r.userName)}</b> <span class="mut">${esc(r.userEmail)}</span><p>${esc(r.message)}</p></div><div class="chips"><button class="pri ap" data-u="${d.id}">Approve</button><button class="sec rj" data-u="${d.id}">Reject</button></div></div>`}).join('')||'<p class="mut">No pending requests.</p>'}</div>
<div class="card"><h2>Pro users (${pu.size})</h2>${pu.docs.map(d=>{const u=d.data(),e=u.premiumExpiresAt?.toDate?.();return `<div class="rw"><div><b>${esc(u.fullName)}</b> <span class="mut">${esc(u.email)}</span><p class="mut">${esc(u.premiumSource||'')} · ${e?(e.getFullYear()>2090?'no expiry':'until '+e.toLocaleDateString()):'—'}${e&&e<new Date()?' · EXPIRED':''}</p></div><button class="sec rv" data-u="${d.id}">Revoke</button></div>`}).join('')||'<p class="mut">No Pro users.</p>'}</div>
<div class="card"><h2>Grant Pro by user ID</h2><form id="gf" class="fm"><label>User UID<input name="u" required></label><label>Duration${durSel('gd')}</label><label class="w">Reason<input name="r"></label><button class="pri w">Grant Pro</button></form></div>
<div class="card"><h2>OPay payments (${mp.size})</h2>${mp.docs.map(d=>{const p=d.data();return `<div class="rw"><div><b>${esc(p.userName)}</b> <span class="mut">${esc(p.userEmail)}</span><p class="mut">${esc(p.transactionReference)} · ${esc(p.paymentDate)} · ${money(p.amount)}</p></div><div class="chips"><button class="pri pa" data-i="${d.id}" data-u="${p.userId}">Approve</button><button class="sec pj" data-i="${d.id}">Reject</button></div></div>`}).join('')||'<p class="mut">No pending payments.</p>'}</div></div>`;
const done=async(f,m)=>{try{await f();toast(m);admin(c)}catch(er){toast(er.message||'Action failed')}};
c.querySelectorAll('.ap').forEach(b=>b.onclick=()=>open(`<h2>Approve Pro</h2><label>Duration${durSel('ad')}</label><button class="pri" id="go" style="margin-top:14px">Approve</button>`)||($('#go').onclick=()=>{const u=b.dataset.u,d=+$('#ad').value;close();done(()=>grant(u,d,'approved request',[bt=>bt.update(doc(db,'premiumRequests',u),{status:'approved',reviewedBy:auth.currentUser.uid,reviewedAt:ts()})]),'Approved')}));
c.querySelectorAll('.rj').forEach(b=>b.onclick=()=>{const n=prompt('Reason (shown to the user)');if(n===null)return;done(async()=>{const bt=writeBatch(db);bt.update(doc(db,'premiumRequests',b.dataset.u),{status:'rejected',reviewNote:n,reviewedBy:auth.currentUser.uid,reviewedAt:ts()});bt.set(doc(collection(db,'adminAuditLogs')),{admin:auth.currentUser.uid,userId:b.dataset.u,action:'reject_premium_request',reason:n,createdAt:ts()});await bt.commit()},'Rejected')});
c.querySelectorAll('.rv').forEach(b=>b.onclick=()=>{if(!confirm('Revoke Pro for this user?'))return;done(async()=>{const bt=writeBatch(db);bt.update(doc(db,'users',b.dataset.u),{premium:false,premiumRevokedAt:ts(),premiumRevokedBy:auth.currentUser.uid,updatedAt:ts()});bt.set(doc(collection(db,'adminAuditLogs')),{admin:auth.currentUser.uid,userId:b.dataset.u,action:'revoke_premium',createdAt:ts()});await bt.commit()},'Revoked')});
$('#af').onsubmit=e=>{e.preventDefault();const m=new FormData(e.target).get('m').trim();if(!m)return;done(()=>addDoc(collection(db,'announcements'),{message:m,createdAt:serverTimestamp(),createdBy:auth.currentUser.uid}),'Notification sent to all users')};
$('#gf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));done(()=>grant(f.u.trim(),+$('#gd').value,f.r),'Pro granted')};
c.querySelectorAll('.pa').forEach(b=>b.onclick=()=>done(()=>grant(b.dataset.u,365,'manual OPay payment',[bt=>bt.update(doc(db,'manualPaymentRequests',b.dataset.i),{status:'approve',reviewedBy:auth.currentUser.uid,reviewedAt:ts()})]),'Payment approved'));
c.querySelectorAll('.pj').forEach(b=>b.onclick=()=>{const n=prompt('Reason');if(n===null)return;done(()=>updateDoc(doc(db,'manualPaymentRequests',b.dataset.i),{status:'reject',reviewReason:n,reviewedBy:auth.currentUser.uid,reviewedAt:ts()}),'Rejected')})}
catch(er){c.innerHTML=`<div class="pg"><div class="card"><h2>Staff dashboard</h2><p class="mut">${esc(er.code==='permission-denied'?'Permission denied. Publish the new Firestore rules first.':er.message)}</p></div></div>`}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
